name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old files and extract ZIP
        run: |
          echo "🧹 Cleaning old files (keeping .git, .github, *.zip)..."
          
          # Remove everything except .git, .github and zip files
          find . -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.' \
            ! -name '*.zip' \
            -exec rm -rf {} \;
          
          echo "📦 Extracting ZIP files..."
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "  → Extracting $zipfile..."
              unzip -o "$zipfile" -d temp_extract
            fi
          done
          
          # Move extracted contents to root
          if [ -d "temp_extract" ]; then
            echo "📁 Moving files to root..."
            cp -r temp_extract/* . 2>/dev/null || true
            cp -r temp_extract/.* . 2>/dev/null || true
            rm -rf temp_extract
            echo "✅ Done!"
          fi
          
          # Remove zip files from build
          rm -f *.zip
          
          echo "📋 Final structure:"
          ls -la

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
