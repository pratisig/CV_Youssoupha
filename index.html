<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youssoupha Mbodji – Expert SIG & Information Manager</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D2137;--teal:#1B7A6E;--teal2:#25A899;--gold:#E8B84B;--light:#F4F7FA;--white:#FFFFFF;--text:#1a2a3a;--muted:#5a7a8a;--border:#dde6ee;}
html,body{height:100%;font-family:'Segoe UI',Arial,sans-serif;background:var(--light);color:var(--text);}

/* ── NAV ── */
#topnav{position:fixed;top:0;left:0;right:0;background:var(--navy);z-index:3000;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.nav-brand{color:var(--gold);font-weight:800;font-size:14px;letter-spacing:1px;white-space:nowrap}
.nav-links{display:flex;gap:4px}
.nav-links a{color:#b0c8d8;font-size:11px;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:6px;transition:all .2s;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.1);color:var(--gold)}
.btn-dl{background:var(--teal);color:#fff;font-size:10px;font-weight:700;padding:6px 14px;border-radius:20px;text-decoration:none;letter-spacing:.5px;transition:background .2s}
.btn-dl:hover{background:var(--teal2)}

/* ── PAGES (conteneurs racine) ── */
/* Toutes les pages sont cachées sauf .active */
.page{display:none}
.page.active{display:block}

/* Page CV occupe exactement la fenêtre moins la nav */
#page-cv.active{display:flex;flex-direction:column;height:calc(100vh - 48px);margin-top:48px;overflow:hidden}

/* Pages Projets & À propos scrollent normalement */
#page-projects.active,#page-about.active{display:block;margin-top:48px;min-height:calc(100vh - 48px);overflow-y:auto}

/* ── HEADER ── */
#cv-header{background:var(--navy);color:#fff;display:flex;align-items:stretch;min-height:110px;flex-shrink:0;z-index:1001}
#header-left{background:#0a1c2e;display:flex;align-items:center;justify-content:center;padding:15px 20px;min-width:110px}
#avatar-img{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;display:block}
#avatar-ph{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold);background:linear-gradient(135deg,var(--teal),var(--teal2));display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}
#header-info{flex:1;padding:12px 20px;display:flex;flex-direction:column;justify-content:center}
#header-info h1{font-size:22px;font-weight:700;letter-spacing:1px;color:#fff;margin-bottom:2px}
.hd-title{font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.contact-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:2px}
.ci{font-size:10.5px;color:#b0c8d8;display:flex;align-items:center;gap:5px}
.ci a{color:#b0c8d8;text-decoration:none}.ci a:hover{color:var(--gold)}
.ci svg{width:12px;height:12px;fill:#b0c8d8}
#header-badges{display:flex;flex-direction:column;justify-content:center;padding:10px 18px;gap:5px;min-width:140px;background:rgba(0,0,0,.1)}
.badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px 10px;font-size:9.5px;color:var(--gold);text-align:center;white-space:nowrap;font-weight:600}

/* ── CV MAIN ── */
#cv-main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:320px;min-width:300px;background:var(--white);border-right:1.5px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;z-index:1000}
#sidebar-tabs{display:flex;border-bottom:2px solid var(--border);position:sticky;top:0;background:white;z-index:10}
.tab-btn{flex:1;padding:11px 4px;font-size:10px;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}
.tab-content{display:none;padding:15px;flex:1}
.tab-content.active{display:block}

/* timeline */
.tl-item{display:flex;gap:12px;margin-bottom:12px;cursor:pointer;border-radius:10px;padding:10px;transition:all .2s;border:1px solid transparent}
.tl-item:hover,.tl-item.active{background:white;border-color:var(--border);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.tl-item.active{border-left:4px solid var(--teal)}
.tl-left{display:flex;flex-direction:column;align-items:center;min-width:32px}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:2px solid transparent;background:white;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.tl-line{width:2px;background:var(--border);flex:1;margin:4px 0}
.tl-body{flex:1;min-width:0}
.tl-period{font-size:9px;color:var(--gold);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.tl-org{font-size:12px;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:2px}
.tl-pos{font-size:10.5px;color:var(--teal);font-weight:600;margin-bottom:3px}
.tl-loc{font-size:10px;color:var(--muted)}
.org-logo-tl{height:18px;max-width:80px;object-fit:contain;margin-bottom:5px;display:block}

/* skills */
.skills-section{margin-bottom:18px}
.skills-title{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.skills-title::before{content:'';display:block;width:4px;height:14px;background:var(--teal);border-radius:2px}
.skill-item{margin-bottom:8px}
.skill-label{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:4px;color:var(--text);font-weight:500}
.skill-bar{height:6px;background:#e8eef3;border-radius:4px;overflow:hidden}
.skill-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.tag{display:inline-block;background:var(--light);border:1px solid var(--border);border-radius:12px;padding:3px 10px;font-size:9.5px;color:var(--teal);margin:2px;font-weight:600}
.tag-gold{background:#fef9ee;border-color:#f0d080;color:#8a6200}

/* edu */
.edu-item{margin-bottom:12px;padding:10px;background:var(--light);border-radius:8px;border-left:3px solid var(--teal);transition:transform .2s}
.edu-item:hover{transform:translateX(3px)}
.edu-year{font-size:9px;color:var(--gold);font-weight:800}
.edu-degree{font-size:11px;font-weight:700;color:var(--navy);margin:2px 0}
.edu-school{font-size:10px;color:var(--muted);line-height:1.3}
.edu-mention{font-size:9.5px;color:var(--teal2);font-weight:700;margin-top:3px}

/* stats */
.stat-row{display:flex;gap:8px;margin-bottom:15px}
.stat-box{flex:1;background:var(--navy);color:#fff;border-radius:8px;padding:10px 5px;text-align:center}
.stat-num{font-size:18px;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:8px;color:#8ab0c8;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── MAP ── */
#map-wrap{flex:1;display:flex;flex-direction:column;position:relative}
#map{flex:1;z-index:1}
#map-legend{position:absolute;bottom:20px;left:20px;background:white;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:10px;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.1);max-width:210px}
#map-legend h4{font-size:11px;color:var(--navy);margin-bottom:8px;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:4px}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--text);font-weight:500;font-size:10px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-box{width:16px;height:10px;border-radius:2px;flex-shrink:0;opacity:.7}

/* info panel */
#info-panel{position:absolute;top:20px;right:20px;width:300px;background:rgba(255,255,255,.98);border:1px solid var(--border);border-radius:12px;padding:18px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;max-height:calc(100% - 40px);overflow-y:auto;backdrop-filter:blur(4px)}
#info-panel h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
#info-panel .ip-period{font-size:10px;color:var(--gold);font-weight:800;text-transform:uppercase;margin-bottom:8px}
#info-panel .ip-org{font-size:12px;color:var(--teal);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px}
#info-panel .ip-logo{height:22px;max-width:100px;object-fit:contain}
#info-panel ul{list-style:none;padding:0}
#info-panel ul li{font-size:11px;color:var(--text);padding:6px 0 6px 18px;border-bottom:1px solid #f0f4f7;position:relative;line-height:1.5}
#info-panel ul li::before{content:'\2022';position:absolute;left:4px;color:var(--teal);font-weight:700;font-size:14px}
.ip-tags{display:flex;flex-wrap:wrap;margin-top:12px;gap:4px}

/* markers */
.custom-marker{width:34px;height:34px;border-radius:50%;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:transform .2s}
.custom-marker:hover{transform:scale(1.1)}

/* ── PAGE PROJETS ── */
.page-hero{background:linear-gradient(135deg,var(--navy),#1a3a5c);color:#fff;padding:40px 40px 30px;position:relative;overflow:hidden}
.page-hero::before{content:'';position:absolute;right:-60px;top:-60px;width:300px;height:300px;border-radius:50%;background:rgba(37,168,153,.1)}
.page-hero h2{font-size:26px;font-weight:800;margin-bottom:8px}
.page-hero p{font-size:13px;color:#b0c8d8;max-width:640px;line-height:1.7}
.hero-stats{display:flex;gap:30px;margin-top:20px;flex-wrap:wrap}
.hero-stat-num{font-size:28px;font-weight:800;color:var(--gold)}
.hero-stat-lbl{font-size:10px;color:#8ab0c8;text-transform:uppercase;letter-spacing:.5px}

/* filter bar */
.filter-bar{padding:20px 40px 0;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{background:white;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--teal);color:white;border-color:var(--teal)}

.projects-grid{padding:20px 40px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px}
.project-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08);transition:all .3s;border:1px solid var(--border)}
.project-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.15)}
.project-card[data-hidden="true"]{display:none}
.pch{height:150px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pch.gis-bg{background:linear-gradient(135deg,#0D2137,#1B7A6E)}
.pch.data-bg{background:linear-gradient(135deg,#1a2a5c,#2980B9)}
.pch.dash-bg{background:linear-gradient(135deg,#2c1a00,#E8B84B)}
.pch.web-bg{background:linear-gradient(135deg,#001a3c,#8E44AD)}
.pch.carto-bg{background:linear-gradient(135deg,#003d20,#1B7A6E)}
.pch .proj-icon{font-size:58px;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.pch .pbadge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:3px 10px;font-size:9px;color:#fff;font-weight:700;backdrop-filter:blur(4px)}
.pch .porg{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.3);border-radius:6px;padding:4px 8px;font-size:9px;color:#fff;font-weight:700}
.pch .ptype{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.45);border-radius:6px;padding:3px 8px;font-size:9px;color:#b0e8e0;font-weight:700;letter-spacing:.3px}
.pcb{padding:18px}
.ptitle{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3}
.psub{font-size:11px;color:var(--teal);font-weight:600;margin-bottom:8px}
.pdesc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.pimpact{background:var(--light);border-radius:8px;padding:10px;border-left:3px solid var(--gold)}
.pimpact-lbl{font-size:9px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.pimpact-txt{font-size:10.5px;color:var(--text);line-height:1.5}
.plinks{display:flex;gap:8px;margin-top:12px}
.plbtn{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);font-size:10px;font-weight:700;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--muted);transition:all .2s}
.plbtn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.plbtn.primary:hover{background:var(--teal2)}
.plbtn:hover{border-color:var(--teal);color:var(--teal)}

/* ── PAGE À PROPOS ── */
.about-container{max-width:900px;margin:0 auto;padding:40px 30px}
.about-hero{display:flex;gap:30px;align-items:flex-start;margin-bottom:30px;background:white;border-radius:16px;padding:30px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.about-photo{width:130px;height:130px;border-radius:50%;border:4px solid var(--teal);object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff}
.about-text h2{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px}
.about-title{font-size:12px;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.about-text p{font-size:12.5px;color:var(--muted);line-height:1.7}
.about-section{background:white;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.05
